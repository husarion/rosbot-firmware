[platformio]
default_envs = rosbot, rosbot_release, rosbot_xl, rosbot_xl_release

; ──────────────────────────────────────────────────────────
; Base config shared by the STM32 firmware envs
; ──────────────────────────────────────────────────────────
[stm32]
; Unit tests are host-only (env:native); keep `pio test` from uploading them.
test_ignore = *
framework = arduino
board = rosbot_stm32f407  ; repo-local board (boards/), generic F407ZG variant — shared by rosbot & rosbot_xl
platform = https://github.com/husarion/platformio_boards#1.0.0
platform_packages = framework-arduinoststm32 @ https://github.com/husarion/Arduino_Core_STM32#97731bc2299e1984f0baa5c1fea968a1bd05520d

upload_protocol = stlink
monitor_speed = 921600
monitor_port = /dev/ttyUSB0
debug_tool = stlink
debug_speed = 4000

lib_deps =
    https://github.com/husarion/STM32Ethernet#1.0.0
    https://github.com/stm32duino/LwIP#2.2.1
    https://github.com/stm32duino/STM32FreeRTOS#10.3.3
    https://github.com/adafruit/Adafruit_Sensor#1.1.15
    https://github.com/adafruit/Adafruit_BNO055#1.6.4
    https://github.com/adafruit/Adafruit_BusIO#1.14.0
    https://github.com/pololu/vl53l0x-arduino#1.3.1

build_unflags =
    -std=gnu++14

build_flags =
    -std=gnu++17
    -g
    -I include
    -I bridge/rosbot_mavlink_bridge/mavlink_dialect/rosbot
    -D TARGET_STM32F4
    -D FW_VERSION=\"v2.2.1-jazzy\"
    -Wall
    -Wextra
    -Wfatal-errors
    -Wmissing-field-initializers
    -Wdouble-promotion
    -Wshadow
    -Wno-deprecated-declarations # Ignore deprecation warnings from the libraries we use

; ──────────────────────────────────────────────────────────
; Release optimization flags
; NOTE: the platform appends its own -Os after these, so release builds are
; effectively -Os — see "Optimisation level" in ARCHITECTURE.md.
; ──────────────────────────────────────────────────────────
[release_flags]
build_flags =
    -O2
    -D RELEASE
    -funroll-loops
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    ; causes issues with FreeRTOS and some libraries, needs investigation
    ; -flto
    ; potentially unsafe math optimizations, needs testing
    ; -ffast-math
    ; -funsafe-math-optimizations

; ──────────────────────────────────────────────────────────
; ROSBOT — single binary, runtime-selected upstream link
; ──────────────────────────────────────────────────────────
[env:rosbot]
extends = stm32
build_src_filter =
  +<rosbot/*>
  -<rosbot_xl/*>
build_flags =
    ${stm32.build_flags}
    -D ENABLE_HWSERIAL1
    -D ENABLE_HWSERIAL3
    -D ROSBOT

[env:rosbot_release]
extends = env:rosbot
build_unflags =
    ${stm32.build_unflags}
    -g
build_flags =
    ${env:rosbot.build_flags}
    ${release_flags.build_flags}


; ──────────────────────────────────────────────────────────
; ROSBOT XL — single binary, runtime-selected upstream link
; ──────────────────────────────────────────────────────────
[env:rosbot_xl]
extends = stm32
build_src_filter =
  -<rosbot/*>
  +<rosbot_xl/*>
build_flags =
    ${stm32.build_flags}
    -D ENABLE_HWSERIAL1
    -D ETHERNET_USE_FREERTOS
    -D LAN9303
    -D ROSBOT_XL

[env:rosbot_xl_release]
extends = env:rosbot_xl
build_unflags =
    ${stm32.build_unflags}
    -g
build_flags =
    ${env:rosbot_xl.build_flags}
    ${release_flags.build_flags}


; ──────────────────────────────────────────────────────────
; Host unit tests — `pio test -e native`. Hardware-free code only; the
; Arduino / FreeRTOS headers come from test/native_stubs.
; ──────────────────────────────────────────────────────────
[env:native]
platform = native
build_src_filter = -<*>
; Tested headers are reached by -I; every lib that needs hardware headers is
; ignored below — a new lib/ that does must be added here too.
build_flags =
    -std=gnu++17
    -I test/native_stubs
    -I lib/encoder
    -I lib/fan
    -Wall
    -Wextra
    -Wdouble-promotion
    -Wshadow
lib_ignore =
    battery
    boot_option
    comm_manager
    eeprom
    encoder
    fan
    fault
    i2c_fast_mode
    imu
    imu_calibration
    indicator
    led_strip
    mavlink
    motor
    persistent_config
    power_board
    range
test_framework = unity
