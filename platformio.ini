; Firmware builds with CMake (CMakeLists.txt). PlatformIO only runs the host
; unit tests until they move to CTest.
[platformio]
default_envs = native

; ──────────────────────────────────────────────────────────
; Host unit tests — `pio test -e native`. Hardware-free code only; the
; CMSIS device / FreeRTOS headers come from test/native_stubs.
; ──────────────────────────────────────────────────────────
[env:native]
platform = native
build_src_filter = -<*>
; Tested headers are reached by -I; every lib that needs hardware headers is
; ignored below — a new lib/ that does must be added here too.
build_flags =
    -std=gnu++17
    -I test/native_stubs
    -I lib/battery
    -I lib/encoder
    -I lib/fan
    -I lib/platform
    -I lib/power_board
    -Wall
    -Wextra
    -Wdouble-promotion
    -Wshadow
lib_ignore =
    battery
    boot_option
    comm_manager
    eeprom
    encoder
    ethernet
    fan
    fault
    imu
    imu_calibration
    indicator
    led_strip
    mavlink
    motor
    persistent_config
    platform
    power_board
    range
    vl53l0x
test_framework = unity
