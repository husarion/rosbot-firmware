---
name: Release

# Fired by `just release` pushing a `v<X>.<Y>.<Z>[-<distro>]` tag.
# The recipe has already bumped FW_VERSION, written the CHANGELOG.md
# section, committed, and tagged — this workflow's job is to build, name
# the artefacts and publish the GitHub Release with the CHANGELOG section
# as the body.
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.parse.outputs.tag_name }}
      version: ${{ steps.parse.outputs.version }}
      distro: ${{ steps.parse.outputs.distro }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.\-]+)?$ ]]; then
            echo "::error::tag '${TAG}' must look like v<X>.<Y>.<Z>[-<distro>]"
            exit 1
          fi
          VERSION=$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+')
          DISTRO=$(echo "$TAG" | sed -E "s/^v[0-9]+\.[0-9]+\.[0-9]+-?//")
          echo "tag_name=${TAG}"   >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "distro=${DISTRO}"   >> $GITHUB_OUTPUT
          echo "Tag ${TAG} -> version=${VERSION} distro=${DISTRO:-<none>}"

  firmware-release:
    name: Firmware release
    needs: parse-tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.parse-tag.outputs.tag_name }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6

      - name: Verify FW_VERSION matches tag
        run: |
          expected="-D FW_VERSION=\\\"${TAG_NAME}\\\""
          grep -F -- "${expected}" platformio.ini \
            || { echo "::error::FW_VERSION in platformio.ini doesn't match tag ${TAG_NAME}"; grep FW_VERSION platformio.ini; exit 1; }

      - name: Install PlatformIO
        run: pip3 install -U platformio

      - name: Build all release envs (micro-ROS + MAVLink)
        run: |
          pio run -e rosbot_release -e rosbot_xl_release \
                  -e rosbot_mavlink_release -e rosbot_xl_mavlink_release

      - name: Rename binaries
        run: |
          mkdir -p release
          # micro-ROS firmware stays jazzy-pinned by micro_ros_arduino;
          # keep the -<distro> suffix on those artefacts.
          cp .pio/build/rosbot_release/firmware.bin    "release/rosbot-${TAG_NAME}.bin"
          cp .pio/build/rosbot_xl_release/firmware.bin  "release/rosbot_xl-${TAG_NAME}.bin"
          # MAVLink firmware is distro-agnostic (D24 in MAVLINK_MIGRATION.md) —
          # drop the suffix so operators see one binary covers every supported
          # SBC distro.
          cp .pio/build/rosbot_mavlink_release/firmware.bin \
             "release/rosbot_mavlink-${VERSION}.bin"
          cp .pio/build/rosbot_xl_mavlink_release/firmware.bin \
             "release/rosbot_xl_mavlink-${VERSION}.bin"
          echo "--- Release artifacts ---"
          ls -la release/

      - name: Extract release body from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION_KEY="${TAG_NAME#v}"
          awk -v key="## [${VERSION_KEY}]" '
            index($0, key) == 1 { capturing=1; next }
            /^## \[/             { capturing=0 }
            capturing            { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::No CHANGELOG.md section found for [${VERSION_KEY}]"
            echo "--- CHANGELOG.md headings ---"
            grep -nE '^## \[' CHANGELOG.md || true
            exit 1
          fi
          # Trim leading and trailing blank lines.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' release_body.md
          echo "--- release body ---"
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release_body.md
          files: |
            release/rosbot-${{ env.TAG_NAME }}.bin
            release/rosbot_xl-${{ env.TAG_NAME }}.bin
            release/rosbot_mavlink-${{ env.VERSION }}.bin
            release/rosbot_xl_mavlink-${{ env.VERSION }}.bin
            LICENSE

  bridge-release:
    name: Bridge release tarball (${{ matrix.distro }})
    needs: parse-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble]
    env:
      TAG_NAME: ${{ needs.parse-tag.outputs.tag_name }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
    container: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v6
      - name: Build bridge package
        shell: bash
        run: |
          # Drop `-u` while sourcing ROS overlays — ROS's setup.bash trips
          # on AMENT_TRACE_SETUP_FILES under nounset. -e and pipefail keep
          # genuine errors fatal.
          set -eo pipefail
          source /opt/ros/${{ matrix.distro }}/setup.bash
          apt-get update
          rosdep update --rosdistro=${{ matrix.distro }}
          rosdep install --from-paths bridge --ignore-src -y
          colcon build --packages-select rosbot_mavlink_bridge --base-paths bridge
      - name: Package source tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tarball="rosbot_mavlink_bridge-${VERSION}-${{ matrix.distro }}-src.tar.gz"
          # Include both the bridge package and the dialect headers it depends
          # on. The relative path inside `bridge/`'s CMakeLists.txt is the
          # contract — the tarball preserves it.
          tar --transform "s,^,rosbot_mavlink_bridge-${VERSION}/," \
              -czf "release/${tarball}" \
              bridge lib/mavlink/dialect/generated lib/mavlink/dialect/rosbot.xml \
              MAVLINK_MIGRATION.md LICENSE
          ls -la release/
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: release/rosbot_mavlink_bridge-${{ env.VERSION }}-${{ matrix.distro }}-src.tar.gz

  # Container images on GHCR — built from bridge/Dockerfile, multi-arch
  # (amd64 + arm64 so the SBC can pull native). Runs in parallel with
  # bridge-release, against the same release tag. Independent — failure
  # here doesn't roll back the firmware/tarball publication.
  bridge-image:
    name: Bridge container image (${{ matrix.distro }})
    needs: parse-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble]
    env:
      VERSION: ${{ needs.parse-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/rosbot-mavlink-bridge"
          # Strip leading 'v' from version (docker tag convention).
          # ${{ matrix.distro }} is the bridge's ROS distro, not the
          # firmware tag's distro suffix — see the table in the release
          # notes for the user-facing pairing.
          version_tag="${VERSION#v}"
          {
            echo "tags<<EOF"
            echo "${name}:${version_tag}-${{ matrix.distro }}"
            echo "${name}:latest-${{ matrix.distro }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ROS_DISTRO=${{ matrix.distro }}
          tags: ${{ steps.img.outputs.tags }}
          push: true
