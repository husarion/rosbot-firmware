name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version to bump (major, minor, patch)
        default: patch
        required: true

jobs:
  bump-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
      version: ${{ steps.bump.outputs.version }}
      distro: ${{ steps.bump.outputs.distro }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve distro from branch name
        id: distro
        run: |
          distro=$(echo "${GITHUB_REF_NAME}" | awk -F'/' '{print $NF}')
          echo "distro=$distro" >> $GITHUB_OUTPUT
          echo "Distro: $distro"

      - name: Get latest tag for distro
        id: get_tag
        run: |
          distro=${{ steps.distro.outputs.distro }}
          latest_tag=$(git tag -l "${distro}-v*" --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="${distro}-v0.0.0"
          fi
          echo "Latest tag: $latest_tag"
          echo "latest=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          latest="${{ steps.get_tag.outputs.latest }}"
          bump_type="${{ github.event.inputs.bump_type }}"
          distro="${{ steps.distro.outputs.distro }}"

          latest_num=$(echo "$latest" | sed "s/^${distro}-v//")
          IFS='.' read -r major minor patch <<< "$latest_num"

          if [ "$bump_type" = "major" ]; then
            major=$((major + 1)); minor=0; patch=0
          elif [ "$bump_type" = "minor" ]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          version="v${major}.${minor}.${patch}"
          tag_name="${distro}-${version}"

          echo "version=$version"   >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "distro=$distro"     >> $GITHUB_OUTPUT
          echo "New tag: $tag_name"

      - name: Create and push new tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.bump.outputs.tag_name }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/' + tag,
              sha: context.sha
            });
            console.log(`Created tag ${tag}`);

  firmware-release:
    name: Firmware release
    needs: bump-tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.bump-tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip3 install -U platformio

      - name: Update FW_VERSION in platformio.ini
        run: |
          echo "Setting FW_VERSION to ${TAG_NAME}"
          sed -i "s/-D FW_VERSION=\\\\\"[^\"]*\\\\\"/-D FW_VERSION=\\\\\"${TAG_NAME}\\\\\"/" platformio.ini
          echo "--- Verify change ---"
          grep "FW_VERSION" platformio.ini

      - name: Build firmware
        run: pio run -e rosbot_release -e rosbot_xl_release

      - name: Rename binaries
        run: |
          mkdir -p release
          cp .pio/build/rosbot_release/firmware.bin    "release/rosbot_${TAG_NAME}.bin"
          cp .pio/build/rosbot_xl_release/firmware.bin  "release/rosbot_xl_${TAG_NAME}.bin"
          echo "--- Release artifacts ---"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            release/rosbot_${{ env.TAG_NAME }}.bin
            release/rosbot_xl_${{ env.TAG_NAME }}.bin
            LICENSE