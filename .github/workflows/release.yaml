---
name: Release

# Triggered by `just release` pushing a `v<X>.<Y>.<Z>[-<distro>]` tag.
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.parse.outputs.tag_name }}
      version: ${{ steps.parse.outputs.version }}
      distro: ${{ steps.parse.outputs.distro }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.\-]+)?$ ]]; then
            echo "::error::tag '${TAG}' must look like v<X>.<Y>.<Z>[-<distro>]"
            exit 1
          fi
          VERSION=$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+')
          DISTRO=$(echo "$TAG" | sed -E "s/^v[0-9]+\.[0-9]+\.[0-9]+-?//")
          echo "tag_name=${TAG}"   >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "distro=${DISTRO}"   >> $GITHUB_OUTPUT
          echo "Tag ${TAG} -> version=${VERSION} distro=${DISTRO:-<none>}"

  firmware-release:
    name: Firmware release
    needs: parse-tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.parse-tag.outputs.tag_name }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Verify FW_VERSION matches tag
        run: |
          expected="-D FW_VERSION=\\\"${TAG_NAME}\\\""
          grep -F -- "${expected}" platformio.ini \
            || { echo "::error::FW_VERSION in platformio.ini doesn't match tag ${TAG_NAME}"; grep FW_VERSION platformio.ini; exit 1; }

      - name: Install PlatformIO
        run: pip3 install -U platformio

      - name: Build all release envs
        run: |
          pio run -e rosbot_release -e rosbot_xl_release

      - name: Rename binaries
        run: |
          mkdir -p release
          # -${TAG_NAME} keeps the -<distro> suffix — micro_ros_arduino
          # is still jazzy-pinned per platformio.ini.
          cp .pio/build/rosbot_release/firmware.bin    "release/rosbot-${TAG_NAME}.bin"
          cp .pio/build/rosbot_xl_release/firmware.bin "release/rosbot_xl-${TAG_NAME}.bin"
          ls -la release/

      - name: Extract release body from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION_KEY="${TAG_NAME#v}"
          awk -v key="## [${VERSION_KEY}]" '
            index($0, key) == 1 { capturing=1; next }
            /^## \[/             { capturing=0 }
            capturing            { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::No CHANGELOG.md section found for [${VERSION_KEY}]"
            echo "--- CHANGELOG.md headings ---"
            grep -nE '^## \[' CHANGELOG.md || true
            exit 1
          fi
          # Strip leading/trailing blank lines.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' release_body.md
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release_body.md
          files: |
            release/rosbot-${{ env.TAG_NAME }}.bin
            release/rosbot_xl-${{ env.TAG_NAME }}.bin
            LICENSE

  bridge-release:
    name: Bridge release tarball (${{ matrix.distro }})
    needs: parse-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble]
    env:
      TAG_NAME: ${{ needs.parse-tag.outputs.tag_name }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
    container: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build bridge package
        shell: bash
        run: |
          # No -u: ROS's setup.bash trips on unset AMENT_TRACE_SETUP_FILES.
          set -eo pipefail
          source /opt/ros/${{ matrix.distro }}/setup.bash
          apt-get update
          rosdep update --rosdistro=${{ matrix.distro }}
          rosdep install --from-paths bridge --ignore-src -y
          colcon build --packages-select rosbot_mavlink_bridge --base-paths bridge
      - name: Package source tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tarball="rosbot_mavlink_bridge-${VERSION}-${{ matrix.distro }}-src.tar.gz"
          # Dialect headers ride along; bridge/CMakeLists.txt's relative
          # include path is the contract.
          tar --transform "s,^,rosbot_mavlink_bridge-${VERSION}/," \
              -czf "release/${tarball}" \
              bridge lib/mavlink/dialect/generated lib/mavlink/dialect/rosbot.xml \
              MAVLINK_MIGRATION.md LICENSE
          ls -la release/
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: release/rosbot_mavlink_bridge-${{ env.VERSION }}-${{ matrix.distro }}-src.tar.gz

  # Multi-arch GHCR image, independent of bridge-release.
  bridge-image:
    name: Bridge container image (${{ matrix.distro }})
    needs: parse-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, humble]
    env:
      VERSION: ${{ needs.parse-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/rosbot-mavlink-bridge"
          version_tag="${VERSION#v}"  # docker tag convention drops the 'v'
          {
            echo "tags<<EOF"
            echo "${name}:${version_tag}-${{ matrix.distro }}"
            echo "${name}:latest-${{ matrix.distro }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ROS_DISTRO=${{ matrix.distro }}
          tags: ${{ steps.img.outputs.tags }}
          push: true
