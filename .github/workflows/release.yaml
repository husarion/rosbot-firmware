---
name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version to bump (major, minor, patch)
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  bump-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
      version: ${{ steps.bump.outputs.version }}
      distro: ${{ steps.bump.outputs.distro }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve distro from branch name
        id: distro
        run: |
          distro=$(echo "${GITHUB_REF_NAME}" | awk -F'/' '{print $NF}')
          echo "distro=$distro" >> $GITHUB_OUTPUT
          echo "Distro: $distro"

      - name: Get latest tag for distro
        id: get_tag
        run: |
          distro=${{ steps.distro.outputs.distro }}
          # Tag format produced by this workflow: v<major>.<minor>.<patch>-<distro>
          latest_tag=$(git tag -l "v*-${distro}" --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0-${distro}"
          fi
          echo "Latest tag: $latest_tag"
          echo "latest=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          latest="${{ steps.get_tag.outputs.latest }}"
          bump_type="${{ github.event.inputs.bump_type }}"
          distro="${{ steps.distro.outputs.distro }}"

          # Strip leading "v" and trailing "-<distro>" to get bare X.Y.Z
          latest_num=$(echo "$latest" | sed -E "s/^v//; s/-${distro}\$//")
          IFS='.' read -r major minor patch <<< "$latest_num"

          if [ "$bump_type" = "major" ]; then
            major=$((major + 1)); minor=0; patch=0
          elif [ "$bump_type" = "minor" ]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          version="v${major}.${minor}.${patch}"
          tag_name="${version}-${distro}"

          echo "version=$version"   >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "distro=$distro"     >> $GITHUB_OUTPUT
          echo "New tag: $tag_name"

      - name: Update FW_VERSION in platformio.ini
        run: |
          TAG="${{ steps.bump.outputs.tag_name }}"
          echo "Setting FW_VERSION to ${TAG}"
          sed -i "s/-D FW_VERSION=\\\\\"[^\"]*\\\\\"/-D FW_VERSION=\\\\\"${TAG}\\\\\"/" platformio.ini
          echo "--- Verify ---"
          grep "FW_VERSION" platformio.ini

      - name: Commit and push version bump
        id: push
        run: |
          TAG="${{ steps.bump.outputs.tag_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add platformio.ini
          git commit -m "bump FW_VERSION to ${TAG}"
          git push

          NEW_SHA=$(git rev-parse HEAD)
          echo "sha=$NEW_SHA" >> $GITHUB_OUTPUT
          echo "New commit SHA: $NEW_SHA"

      - name: Create tag on new commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.bump.outputs.tag_name }}';
            const sha = '${{ steps.push.outputs.sha }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/' + tag,
              sha: sha
            });
            console.log(`Created tag ${tag} → ${sha}`);

  firmware-release:
    name: Firmware release
    needs: bump-tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.bump-tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-tag.outputs.sha }}

      - name: Verify FW_VERSION
        run: grep "FW_VERSION" platformio.ini

      - name: Install PlatformIO
        run: pip3 install -U platformio

      - name: Build firmware
        run: pio run -e rosbot_release -e rosbot_xl_release

      - name: Rename binaries
        run: |
          mkdir -p release
          cp .pio/build/rosbot_release/firmware.bin    "release/rosbot-${TAG_NAME}.bin"
          cp .pio/build/rosbot_xl_release/firmware.bin  "release/rosbot_xl-${TAG_NAME}.bin"
          echo "--- Release artifacts ---"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            release/rosbot-${{ env.TAG_NAME }}.bin
            release/rosbot_xl-${{ env.TAG_NAME }}.bin
            LICENSE
