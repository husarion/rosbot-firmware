---
# Vendored mavgen output is generator-managed — never touch it from
# pre-commit hooks. Edits to rosbot.xml drive a fresh regen via `just
# mavgen`; trailing-whitespace / clang-format / codespell / copyright
# hooks would otherwise fight the generator and break CI's diff check.
exclude: ^(bridge/rosbot_mavlink_bridge/mavlink_dialect/|lib/mavlink/dialect/(common\.xml|minimal\.xml|standard\.xml))

repos:
  # -------------------------
  # Basic hygiene
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # -------------------------
  # C / C++ formatting
  # -------------------------
  # rosbot_mavlink_bridge is an ament_cmake package: ament_lint_auto wires
  # ament_uncrustify into its `colcon test`, and that style (brace-on-own-
  # line, unindented access specifiers, `Type & name`) diverges from
  # Google/clang-format. Formatting it here with clang-format would pass
  # pre-commit and then fail CI, so it's excluded and reformatted by its
  # own ament_uncrustify hook below instead.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        files: \.(c|cpp|cc|cxx|h|hpp)$
        exclude: ^bridge/rosbot_mavlink_bridge/
        args: [--style=Google]

  # -------------------------
  # Static analysis (fast, embedded-friendly)
  # -------------------------
  # - repo: https://github.com/pocc/pre-commit-hooks
  #   rev: v1.3.5
  #   hooks:
  #     - id: cppcheck
  #       args:
  #         - --enable=all
  #         - --std=c++17
  #         - -Iinclude
  #         - -Isrc
  #     - id: clang-tidy
      # - id: uncrustify # do almost the same as clang-format
      # - id: cpplint # do almost the same as clang-format
      # - id: include-what-you-use # need local installation

  # -------------------------
  # Spelling check
  # -------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: codespell
        description: Checks for common misspellings in text files.
        entry: codespell  *
        language: python
        types: [text]

  # -------------------------
  # YAML formatting
  # -------------------------
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        files: ^(?!.*compose).*$
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '100']

  # -------------------------
  # Copyright check
  # -------------------------
  - repo: local
    hooks:
      - id: ament_copyright
        name: ament_copyright
        description: Check if copyright notice is available in all files.
        stages: [pre-commit]
        entry: bash -c 'source /opt/ros/jazzy/setup.bash && ament_copyright "$@"' --
        language: system
        exclude: ^.*\.md$

  # -------------------------
  # rosbot_mavlink_bridge — same linters ament_lint_auto runs in CI
  # (colcon test), scoped to the package so they match what CI checks.
  # mavlink_dialect/ is vendored mavgen output and stays excluded here
  # too (matches CMakeLists.txt's AMENT_LINT_AUTO_FILE_EXCLUDE).
  # -------------------------
  - repo: local
    hooks:
      - id: ament_uncrustify
        name: ament_uncrustify (rosbot_mavlink_bridge)
        description: Reformat bridge C++ sources to the ROS 2 ament style.
        stages: [pre-commit]
        entry: bash -c 'source /opt/ros/jazzy/setup.bash && ament_uncrustify --reformat "$@"' --
        language: system
        files: ^bridge/rosbot_mavlink_bridge/.*\.(c|cpp|cc|cxx|h|hpp)$
        exclude: ^bridge/rosbot_mavlink_bridge/mavlink_dialect/
      - id: ament_cpplint
        name: ament_cpplint (rosbot_mavlink_bridge)
        description: Check bridge C++ sources against the ROS 2 style guide.
        stages: [pre-commit]
        entry: bash -c 'source /opt/ros/jazzy/setup.bash && ament_cpplint "$@"' --
        language: system
        files: ^bridge/rosbot_mavlink_bridge/.*\.(c|cpp|cc|cxx|h|hpp)$
        exclude: ^bridge/rosbot_mavlink_bridge/mavlink_dialect/
      - id: ament_flake8
        name: ament_flake8 (rosbot_mavlink_bridge)
        description: Check bridge Python (launch files) against ament style.
        stages: [pre-commit]
        entry: bash -c 'source /opt/ros/jazzy/setup.bash && ament_flake8 "$@"' --
        language: system
        files: ^bridge/rosbot_mavlink_bridge/.*\.py$
