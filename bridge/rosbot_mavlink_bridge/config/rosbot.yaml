---
/**:
  ros__parameters:
    transport: serial
    serial_port: /dev/ttySERIAL    # fallback; launch overrides per platform
    serial_baudrate: 921600
    ros_namespace: ''               # match the namespace negotiated over FTDI
    enable_ranges: true
    enable_led_strip: false
    publish_link_state: false
    timesync_alpha: 0.05
    expected_banner_regex: rosbot .* mavlink
