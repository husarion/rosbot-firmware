# Run the MAVLink bridge in a container on the ROSbot SBC.
#
# Networking notes:
# - `network_mode: host` is required so the bridge can (a) receive MAVLink
#   UDP frames the firmware sends to the SBC at 192.168.77.2:14550, and
#   (b) join the same DDS domain as the rosbot snap (default discovery
#   uses multicast on the host's network namespace).
# - `/dev/shm` is shared so FastDDS shared-memory transport works between
#   the container and host-side ROS 2 nodes.
# - `ROS_DOMAIN_ID` defaults to 0 to match the rosbot snap's default
#   (override via env if you change `snap set rosbot ros.domain-id=...`).
#
# Bring up:    docker compose -f bridge/docker-compose.yaml up -d --build
# Tail logs:   docker compose -f bridge/docker-compose.yaml logs -f
# Bring down:  docker compose -f bridge/docker-compose.yaml down
#
# Or via the justfile recipes:    just bridge-up / just bridge-logs / just bridge-down

services:
  rosbot-mavlink-bridge:
    container_name: rosbot-mavlink-bridge
    build:
      # Build context is the repo root so the Dockerfile can COPY both
      # bridge/ and lib/mavlink/dialect/ (the bridge's CMakeLists.txt
      # reaches the dialect headers via a relative path).
      context: ..
      dockerfile: bridge/Dockerfile
      args:
        ROS_DISTRO: jazzy
    image: rosbot-mavlink-bridge:jazzy
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      # Matches the rosbot snap default. If you change the snap's
      # ros.domain-id, change this too.
      ROS_DOMAIN_ID: 0
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      # Disable colour codes — Docker journal already wraps them.
      RCUTILS_COLORIZED_OUTPUT: 0
    volumes:
      - /dev/shm:/dev/shm
    # The launch file pulls peer_ip / namespace / etc. from the bundled
    # config/rosbot_xl.yaml — override here only if you need to deviate
    # from the snap defaults (namespace=rosbot, peer=192.168.77.3).
    command:
      - "ros2"
      - "launch"
      - "rosbot_mavlink_bridge"
      - "rosbot_xl.launch.py"
      - "namespace:=rosbot"
